<script>
  // ISI DUA NILAI INI setelah project Supabase Anda dibuat.

  // anon/public key AMAN untuk ditaruh di frontend (bukan rahasia) --

  const SUPABASE_URL = 'https://lshyxxqzyqyjxsdlavoc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzaHl4eHF6eXF5anhzZGxhdm9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODIyMjUsImV4cCI6MjEwMDI1ODIyNX0.jCktJ-uiTPMg-Mn5OsSWP1bQHpn2dwVs3H6KNCEvdKY';

  // Penangkap error global: kalau ada error JavaScript apa pun (termasuk
  // CDN gagal dimuat, atau SUPABASE_URL/ANON_KEY salah format), tampilkan
  // pesannya langsung di layar. Supaya bisa didiagnosis dari HP tanpa
  // perlu buka Console browser.
  window.addEventListener('error', function(e){
    var box = document.getElementById('fatalError');
    if(box){
      box.style.display = 'block';
      box.textContent = 'Error: ' + (e.message || 'terjadi kesalahan skrip') +
        (e.filename ? ' (baris ' + e.lineno + ')' : '');
    }
    var ls = document.getElementById('loginScreen');
    if(ls) ls.style.display = 'flex';
  });
  window.addEventListener('unhandledrejection', function(e){
    var box = document.getElementById('fatalError');
    if(box){
      box.style.display = 'block';
      box.textContent = 'Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    }
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#eef3f0; --bg:#f6f9f7; --panel:#ffffff; --panel2:#f2f6f3; --panel3:#eaf3ee;
    --ink:#152a21; --line:#e5ebe7; --muted:#748a7e; --faint:#a6b7ac;
    --accent:#1f6d4c; --accent-soft:#dceee3; --accent-ink:#164f38;
    --amber:#e8a23a; --amber-ink:#7a4e05; --watch-bg:#fcf0dd;
    --green:#1f9e6b; --green-bg:#e1f5ea;
    --red:#e15c5c; --red-bg:#fce6e6;
    --mono:'IBM Plex Mono',monospace; --disp:'Plus Jakarta Sans',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-soft);color:var(--accent-ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-soft);}

  #appRoot{max-width:1180px;margin:18px auto;background:var(--panel);border-radius:24px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(21,42,33,.28);border:1px solid var(--line);}

  header.topbar{background:var(--panel);color:var(--ink);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:14px;}
  .brand h1{font-family:var(--disp);font-size:17px;margin:0;font-weight:800;color:var(--ink);}
  .brand p{margin:0;font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap;}
  .role-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .role-badge.ie{background:var(--accent-soft);color:var(--accent-ink);}
  .role-badge.supervisor{background:var(--green-bg);color:var(--green);}
  .role-badge.tamu{background:var(--panel2);color:var(--muted);}
  .line-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent);color:#fff;}
  #logoutBtn{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--ink);font-weight:600;}
  #logoutBtn:hover{background:var(--panel3);}

  main{max-width:1100px;margin:0 auto;padding:22px;background:var(--bg);}
  .panel{background:var(--panel);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(21,42,33,.05);margin-bottom:18px;border:1px solid var(--line);}
  .panel h2{font-family:var(--disp);font-size:19px;margin:0 0 4px;font-weight:800;}
  .panel h3{font-family:var(--disp);font-size:14.5px;margin:0 0 12px;color:var(--ink);font-weight:700;}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px;}

  /* ---- Period toggle ---- */
  .period-toggle{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px;}
  .period-toggle button{border:none;cursor:pointer;padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--body);background:transparent;color:var(--muted);}
  .period-toggle button.active{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px rgba(31,109,76,.5);}
  .date-nav{display:inline-flex;align-items:center;gap:6px;margin:0 0 16px 10px;vertical-align:middle;}
  .date-nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;width:30px;height:30px;border-radius:999px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .date-nav button:hover:not(:disabled){background:var(--panel2);}
  .date-nav button:disabled{opacity:.35;cursor:not-allowed;}
  .date-nav input[type="date"]{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-family:var(--body);color:var(--ink);background:var(--panel);}
  .date-nav .today-btn{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;width:auto;height:auto;background:var(--panel2);color:var(--muted);}
  .date-nav .today-btn.hidden-btn{visibility:hidden;}

  /* ---- KPI cards ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:var(--panel);transition:box-shadow .18s ease, transform .18s ease;}
  .kpi:hover{box-shadow:0 10px 24px -12px rgba(21,42,33,.18);transform:translateY(-1px);}
  .kpi .icn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .kpi .icn svg{width:16px;height:16px;}
  .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;font-family:var(--body);}
  .kpi .val{font-family:var(--disp);font-size:23px;font-weight:800;margin-top:3px;color:var(--ink);}
  .kpi .val small{font-size:11.5px;font-weight:600;color:var(--faint);}

  /* ---- Per-line cards (andon) ---- */
  .andon{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .andon .cell{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--panel);transition:box-shadow .18s ease, transform .18s ease;}
  .andon .cell:hover{box-shadow:0 10px 24px -12px rgba(21,42,33,.18);transform:translateY(-1px);}
  .andon .cell.empty{opacity:.6;}
  .andon .cell.notarget{border-color:var(--amber);}
  .andon .cell .row-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .andon .cell .ln{font-family:var(--disp);font-weight:800;font-size:15.5px;color:var(--ink);}
  .andon .cell .pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .andon .cell.ok .pill{background:var(--green-bg);color:var(--green);}
  .andon .cell.watch .pill{background:var(--watch-bg);color:var(--amber-ink);}
  .andon .cell.risk .pill{background:var(--red-bg);color:var(--red);}
  .andon .cell.empty .pill{background:var(--panel2);color:var(--muted);}
  .andon .cell.notarget .pill{background:var(--watch-bg);color:var(--amber-ink);}
  .andon .cell .bar-track{height:7px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:5px 0 12px;}
  .andon .cell .bar-fill{height:100%;border-radius:999px;}
  .andon .cell.ok .bar-fill{background:var(--green);}
  .andon .cell.watch .bar-fill{background:var(--amber);}
  .andon .cell.risk .bar-fill{background:var(--red);}
  .andon .cell.empty .bar-fill{background:var(--faint);}
  .andon .cell.notarget .bar-fill{background:var(--amber);}
  .andon .cell .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .andon .cell .metric{font-size:11px;color:var(--muted);}
  .andon .cell .metric b{display:block;color:var(--ink);font-family:var(--mono);font-size:13.5px;font-weight:700;margin-top:1px;}

  .legend-row{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin:2px 0 12px;}
  .legend-row span{display:inline-flex;align-items:center;gap:5px;}
  .legend-row i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* ---- Halaman detail line (full page, bukan modal lagi) ---- */
  .ld-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;font-family:var(--body);cursor:pointer;padding:6px 0;margin-bottom:14px;}
  .ld-back:hover{color:var(--accent-ink);}
  .ld-back svg{width:15px;height:15px;}
  .ld-hero{border-radius:20px;padding:22px 24px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:0 18px 40px -18px rgba(21,42,33,.45);}
  .ld-hero.ok{background:linear-gradient(135deg,#1f9e6b,#136b48);}
  .ld-hero.watch{background:linear-gradient(135deg,#e8a23a,#a5680f);}
  .ld-hero.risk{background:linear-gradient(135deg,#e15c5c,#a53838);}
  .ld-hero.empty,.ld-hero.notarget{background:linear-gradient(135deg,#748a7e,#4d5e54);}
  .ld-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .ld-hero-line{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.1;}
  .ld-hero-style{font-size:13px;opacity:.9;margin-top:3px;}
  .ld-hero-pill{font-size:11px;font-weight:700;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(2px);white-space:nowrap;}
  .ld-hero-range{font-size:11.5px;opacity:.85;margin-top:2px;}
  .ld-eff-wrap{margin-top:20px;}
  .ld-eff-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;opacity:.9;margin-bottom:6px;}
  .ld-eff-num{font-family:var(--disp);font-size:22px;font-weight:800;}
  .ld-eff-track{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;}
  .ld-eff-fill{height:100%;border-radius:999px;background:#fff;}

  .ld-super{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel);margin-bottom:18px;}
  .ld-super-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--accent-soft);flex-shrink:0;}
  .ld-super-avatar-fallback{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:17px;flex-shrink:0;}
  .ld-super-name{font-family:var(--disp);font-weight:800;font-size:15.5px;color:var(--ink);}
  .ld-super-role{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:1px;}

  .ld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .ld-stat{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel);}
  .ld-stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;}
  .ld-stat .val{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--ink);margin-top:3px;}

  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--muted);}
  .detail-row .v{font-family:var(--mono);font-weight:600;color:var(--ink);text-align:right;}
  @media (max-width:520px){ .ld-hero-line{font-size:25px;} }

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:var(--body);background:var(--panel2);}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:140px;}

  .btn{border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--body);}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px rgba(31,109,76,.5);}
  .btn.primary:hover{background:var(--accent-ink);}
  .btn.green{background:var(--green);color:#fff;box-shadow:0 8px 18px -8px rgba(31,158,107,.5);}
  .btn.green:hover{background:#188457;}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);}
  .btn.ghost:hover{background:var(--panel2);}
  .btn.danger{background:var(--red-bg);color:var(--red);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .btn:disabled{opacity:.6;cursor:default;}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--panel2);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;}
  th.sortable-th{cursor:pointer;user-select:none;position:relative;padding-right:20px;}
  th.sortable-th:hover{color:var(--accent-ink);background:var(--panel3,var(--panel2));}
  th.sortable-th::after{content:'';position:absolute;right:8px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top-color:var(--line);border-bottom-color:var(--line);opacity:.5;}
  th.sortable-th.sort-asc::after{border-bottom-color:var(--accent);border-top-color:transparent;opacity:1;}
  th.sortable-th.sort-desc::after{border-top-color:var(--accent);border-bottom-color:transparent;opacity:1;}
  tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);text-align:right;}

  .subnav{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .subnav button{background:none;border:none;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--body);}
  .subnav button.active{color:var(--accent);border-bottom-color:var(--accent);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2000;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}

  .chart-box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;background:var(--panel);}
  .chart-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-top:16px;}
  @media (max-width:760px){ .chart-grid{grid-template-columns:1fr;} #appRoot{margin:0;border-radius:0;} }
  .donut-wrap{display:flex;flex-direction:column;align-items:center;}
  .donut-center{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--ink);}

  #loginScreen{position:fixed;inset:0;background:var(--page-bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  #loginScreen .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 20px 45px -24px rgba(21,42,33,.25);}
  #loginScreen h2{margin:0 0 4px;font-size:19px;font-family:var(--disp);font-weight:800;}
  #loginScreen p.sub{margin:0 0 18px;}
  #loginScreen .btn{width:100%;}
  #loginError{color:var(--red);font-size:12.5px;margin:-6px 0 12px;min-height:1em;}
  #fatalError{display:none;background:var(--red-bg);color:var(--red);font-size:12px;padding:10px 12px;border-radius:10px;margin-bottom:14px;word-break:break-word;}
  #appRoot{display:none;}
  .hidden{display:none !important;}

  /* ---- Skill Matrix ---- */
  .sm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
  .sm-stat{border-radius:14px;padding:14px 15px;border:1px solid var(--line);background:var(--panel);}
  .sm-stat .n{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;margin-bottom:4px;}
  .sm-stat .l{font-size:11.5px;color:var(--muted);font-weight:600;}
  .sm-stat.grade-a{background:var(--green-bg);border-color:transparent;} .sm-stat.grade-a .n{color:var(--green);}
  .sm-stat.grade-b{background:var(--watch-bg);border-color:transparent;} .sm-stat.grade-b .n{color:var(--amber-ink);}
  .sm-stat.grade-c{background:var(--red-bg);border-color:transparent;} .sm-stat.grade-c .n{color:var(--red);}
  .sm-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .sm-toolbar .field{min-width:160px;}
  .sm-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:16px;}
  .sm-legend span{display:inline-flex;align-items:center;gap:6px;}
  .sm-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .sm-card{border-radius:16px;padding:15px 16px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden;transition:box-shadow .18s ease, transform .18s ease;}
  .sm-card:hover{box-shadow:0 10px 26px -14px rgba(21,42,33,.28);transform:translateY(-2px);}
  .sm-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
  .sm-card.grade-a::before{background:var(--green);} .sm-card.grade-b::before{background:var(--amber);} .sm-card.grade-c::before{background:var(--red);}
  .sm-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .sm-card .name{font-weight:700;font-size:14px;color:var(--ink);word-break:break-word;}
  .sm-badge{font-family:var(--disp);font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;flex-shrink:0;}
  .sm-badge.grade-a{background:var(--green-bg);color:var(--green);} .sm-badge.grade-b{background:var(--watch-bg);color:var(--amber-ink);} .sm-badge.grade-c{background:var(--red-bg);color:var(--red);}
  .sm-card .smv-row{display:flex;align-items:baseline;gap:5px;margin-bottom:8px;}
  .sm-card .smv-val{font-family:var(--disp);font-weight:800;font-size:21px;color:var(--ink);}
  .sm-card .smv-unit{font-size:11px;color:var(--muted);}
  .sm-bar-track{height:7px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-bottom:10px;}
  .sm-bar-fill{height:100%;border-radius:999px;}
  .sm-bar-fill.grade-a{background:var(--green);} .sm-bar-fill.grade-b{background:var(--amber);} .sm-bar-fill.grade-c{background:var(--red);}
  .sm-card .meta{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .sm-card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}

<script>
const LINES = ['1A','1B','2','3','4','5','8','9A','9B','11A','11B','12A','12B','13A','13B','14'];
const SLOTS = ['07:00-08:00','08:00-09:00','09:00-10:00','10:00-11:00','11:00-12:00','12:00-13:00','13:00-14:00','14:00-15:00','15:00-16:00','16:00-17:00','17:00-18:00','18:00-19:00','19:00-20:00','20:00-21:00','21:00-22:00','22:00-23:00','23:00-00:00','00:00-01:00','01:00-02:00','02:00-03:00','03:00-04:00','04:00-05:00','05:00-06:00','06:00-07:00'];
const API_BASE = '/api';

// ---------- utility ----------
function todayStr(){ return toDateStr(new Date()); }

// ---------- tabel sortable (klik header untuk urutkan) ----------
// Bekerja langsung di DOM baris <tr> yang sudah dirender, jadi tidak perlu
// mengubah cara tiap tabel mengambil/merender datanya masing-masing.
// Panggil sekali setelah <thead> tabel disisipkan ke DOM (aman dipanggil
// berkali-kali -- otomatis diabaikan kalau tabel itu sudah sortable).
function makeTableSortable(table){
  if(!table || table.dataset.sortableInit==='1') return;
  const thead = table.querySelector('thead');
  if(!thead || !thead.rows.length) return;
  table.dataset.sortableInit = '1';
  const headerRow = thead.rows[thead.rows.length-1];
  Array.from(headerRow.cells).forEach((th, idx)=>{
    if(!th.textContent.trim()) return; // kolom kosong (mis. tombol Aksi/Edit) dilewati
    th.classList.add('sortable-th');
    th.title = 'Klik untuk urutkan';
    th.addEventListener('click', ()=>sortTableByColumn(table, idx, th));
  });
}
function parseCellSortValue(text){
  const t = (text||'').trim();
  if(t==='' || t==='-') return null;
  // Format angka id-ID: titik = pemisah ribuan, koma = desimal. Tanda % / unit lain dibuang.
  const numLike = /^-?\d{1,3}(\.\d{3})*(,\d+)?%?$|^-?\d+(,\d+)?%?$/;
  if(numLike.test(t)){
    const num = Number(t.replace(/%/g,'').replace(/\./g,'').replace(',','.'));
    if(!isNaN(num)) return num;
  }
  return t.toLowerCase();
}
function sortTableByColumn(table, colIdx, th){
  const tbody = table.querySelector('tbody');
  if(!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  // Jangan urutkan baris placeholder ("Memuat...", "Belum ada data.", dst -- 1 sel colspan).
  if(!rows.length || (rows.length===1 && rows[0].cells.length<=1)) return;
  const nextDir = th.dataset.sortDir==='asc' ? 'desc' : 'asc';
  table.querySelectorAll('th.sortable-th').forEach(h=>{
    if(h!==th){ delete h.dataset.sortDir; h.classList.remove('sort-asc','sort-desc'); }
  });
  th.dataset.sortDir = nextDir;
  th.classList.toggle('sort-asc', nextDir==='asc');
  th.classList.toggle('sort-desc', nextDir==='desc');
  const dir = nextDir==='asc' ? 1 : -1;
  rows.sort((a,b)=>{
    const av = parseCellSortValue(a.cells[colIdx] && a.cells[colIdx].textContent);
    const bv = parseCellSortValue(b.cells[colIdx] && b.cells[colIdx].textContent);
    if(av===null && bv===null) return 0;
    if(av===null) return 1;   // kosong ('-') selalu di bawah, apapun arah urutan
    if(bv===null) return -1;
    if(typeof av==='number' && typeof bv==='number') return (av-bv)*dir;
    return String(av).localeCompare(String(bv), 'id') * dir;
  });
  rows.forEach(r=>tbody.appendChild(r));
}
function fmtNum(n,dec=0){ if(n===null||n===undefined||isNaN(n)) return '-'; return Number(n).toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtDate(d){ if(!d) return '-'; return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function statusClass(eff){ if(eff===null) return 'empty'; if(eff>=75) return 'ok'; if(eff>=55) return 'watch'; return 'risk'; }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

// ---------- periode: harian / mingguan / bulanan ----------
function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function datesBetween(start,end){
  const out=[]; const cur=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const last=new Date(end.getFullYear(),end.getMonth(),end.getDate());
  while(cur<=last){ out.push(toDateStr(cur)); cur.setDate(cur.getDate()+1); }
  return out;
}
function startOfWeek(d){ const day=d.getDay(); const diff=day===0?6:day-1; const s=new Date(d); s.setDate(d.getDate()-diff); return s; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
// refDate (opsional, string 'YYYY-MM-DD') = tanggal acuan untuk navigasi ke
// periode sebelumnya. Kalau tidak diisi, default ke hari ini (perilaku lama).
// - daily: 1 hari persis di refDate.
// - weekly/monthly: kalau periodenya mencakup hari ini, dipotong sampai hari
//   ini (periode masih berjalan); kalau periode sudah lewat total (masa
//   lalu), tampilkan penuh 1 minggu/1 bulan itu.
function periodDatesFor(period, refDate){
  const ref = refDate ? new Date(refDate+'T00:00:00') : new Date();
  const today = new Date(); today.setHours(0,0,0,0);
  if(period==='weekly'){
    const start = startOfWeek(ref);
    const natural = new Date(start); natural.setDate(natural.getDate()+6);
    const end = (today>=start && today<=natural) ? today : natural;
    return datesBetween(start, end);
  }
  if(period==='monthly'){
    const start = startOfMonth(ref);
    const natural = endOfMonth(ref);
    const end = (today>=start && today<=natural) ? today : natural;
    return datesBetween(start, end);
  }
  return [toDateStr(ref)];
}
function isCurrentPeriod(period, refDate){
  const today = toDateStr(new Date());
  if(period==='daily') return (refDate||today)===today;
  const dates = periodDatesFor(period, refDate);
  return dates.includes(today);
}
function stepRefDate(period, refDate, direction){
  const d = refDate ? new Date(refDate+'T00:00:00') : new Date();
  if(period==='weekly') d.setDate(d.getDate()+direction*7);
  else if(period==='monthly') d.setMonth(d.getMonth()+direction, 1);
  else d.setDate(d.getDate()+direction);
  return toDateStr(d);
}
function periodLabelText(period){ return period==='weekly' ? 'minggu ini' : period==='monthly' ? 'bulan ini' : 'hari ini'; }

// ---------- Tanggal laporan untuk shift yang menyeberang tengah malam ----------
// Contoh: shift mulai 19:00, WH 10.5 jam -> selesai 05:30 hari berikutnya.
// Semua input selama shift itu (baik sebelum maupun sesudah tengah malam)
// harus masuk ke SATU tanggal yang sama: tanggal shift itu berakhir.
async function getEffectiveLineConfig(line, asOfDate){
  try{
    const list = await apiGet('/line-config?line='+encodeURIComponent(line));
    return list && list.length ? list[0] : null;
  }catch(err){ return null; }
}
function computeBusinessDate(shiftStart, wh){
  const todayCal = todayStr();
  if(!shiftStart || !(wh>0)) return todayCal;
  const parts = String(shiftStart).split(':');
  const sh = Number(parts[0]), sm = Number(parts[1]||0);
  if(isNaN(sh)) return todayCal;
  const shiftStartHour = sh + sm/60;
  const crossesMidnight = (shiftStartHour + Number(wh)) > 24;
  if(!crossesMidnight) return todayCal;
  const now = new Date();
  const nowHour = now.getHours() + now.getMinutes()/60;
  if(nowHour >= shiftStartHour){
    // Bagian awal shift (malam ini, sebelum tengah malam) -> laporan masuk ke tanggal BESOK,
    // yaitu tanggal saat shift ini berakhir.
    const tmr = new Date(now); tmr.setDate(now.getDate()+1);
    return toDateStr(tmr);
  }
  // Bagian lanjutan shift (dini hari, sesudah tengah malam) -> tanggal kalender saat ini
  // sudah benar merupakan tanggal shift berakhir.
  return todayCal;
}
function periodRangeText(dates, period){
  if(period==='daily') return new Date(dates[0]+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const first = new Date(dates[0]+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  const last = new Date(dates[dates.length-1]+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  return first+' – '+last+' · '+dates.length+' hari';
}
// ---------- Halaman detail line (full page) ----------
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function summarizeByOperator(list){
  const map = {};
  (list||[]).forEach(p=>{
    const name = (p.nama_operator || p.namaOperator || '').trim() || '(Tanpa Nama)';
    const smv = Number(p.smv) || 0;
    if(!map[name]) map[name] = { count:0, total:0 };
    map[name].count += 1;
    map[name].total += smv;
  });
  return Object.keys(map).sort((a,b)=>a.localeCompare(b)).map(name=>({ name, ...map[name] }));
}

// Export sebuah elemen (mis. tabel skill matrix) jadi file PNG, termasuk
// bagian yang di luar area scroll (ukuran dipaksa ke ukuran penuh konten
// sebelum di-capture, lalu dikembalikan seperti semula).
async function exportElementAsImage(elId, filename){
  const el = document.getElementById(elId);
  if(!el) return;
  if(typeof html2canvas !== 'function'){ showToast('Fitur export gambar belum siap, coba lagi sebentar.'); return; }

  const fullWidth = el.scrollWidth;
  const fullHeight = el.scrollHeight;

  const prevOverflow = el.style.overflow;
  const prevMaxHeight = el.style.maxHeight;
  const prevWidth = el.style.width;
  const prevHeight = el.style.height;
  el.style.overflow = 'visible';
  el.style.maxHeight = 'none';
  el.style.width = fullWidth + 'px';
  el.style.height = fullHeight + 'px';

  try{
    const canvas = await html2canvas(el, {
      backgroundColor: '#ffffff',
      scale: 2,
      width: fullWidth,
      height: fullHeight,
      windowWidth: fullWidth,
      windowHeight: fullHeight,
    });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    showToast('Gagal export gambar: '+err.message);
  }finally{
    el.style.overflow = prevOverflow;
    el.style.maxHeight = prevMaxHeight;
    el.style.width = prevWidth;
    el.style.height = prevHeight;
  }
}
// Cache nama+foto Supervisor per line, diisi oleh loadSupervisors() setelah login.
let __supervisorsByLine = {};
async function loadSupervisors(){
  try{
    const list = await apiGet('/supervisors');
    __supervisorsByLine = {};
    (list||[]).forEach(s=>{ if(s.line) __supervisorsByLine[s.line] = s; });
  }catch(err){ /* non-kritikal -- halaman detail tetap jalan tanpa kartu supervisor */ }
}
// Resize + kompres gambar di sisi klien sebelum dikirim ke server sebagai
// base64 (data URI). Foto profil tidak perlu resolusi tinggi, jadi dibatasi
// max 400px di sisi terpanjang -- supaya payload JSON tetap kecil (jauh di
// bawah batas 2MB yang dicek di backend) dan upload tetap cepat di HP.
function resizeImageToBase64(file, maxDim=400, quality=0.85){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){
      reject(new Error('File harus berupa gambar (PNG/JPG/WEBP).')); return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Gagal membaca file.'));
    reader.onload = ()=>{
      img.onerror = ()=>reject(new Error('Gagal memuat gambar.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function initials(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts.length>1?parts[parts.length-1][0]:'')).toUpperCase();
}

// Menyimpan section (view-tamu/view-supervisor/view-ie) yang aktif sebelum
// halaman detail dibuka, supaya tombol "Kembali" bisa memulihkannya.

function openLineDetail(line){

function renderLineDetailPage(r){
  const isSupport = r.lineType==='preparation';
  const pillLabel = r.cls==='ok' ? 'Baik' : r.cls==='watch' ? 'Waspada' : r.cls==='risk' ? 'Kritis' : r.cls==='notarget' ? 'Target Belum Diisi' : 'Belum Update';
  const barPct = r.eff===null ? 4 : Math.max(4, Math.min(r.eff, 100));

  const sup = __supervisorsByLine[r.line];
  const supervisorCard = sup ? `
    <div class="ld-super">

        ? `<img class="ld-super-avatar" src="${escapeHtml(sup.photo_url)}" alt="Foto ${escapeHtml(sup.full_name||'Supervisor')}">`
        : `<div class="ld-super-avatar-fallback">${initials(sup.full_name)}</div>`}
      <div>
        <div class="ld-super-name">${escapeHtml(sup.full_name || 'Belum ada nama')}</div>
        <div class="ld-super-role">Supervisor Line ${escapeHtml(r.line)}</div>
      </div>
    </div>` : `
    <div class="ld-super">
      <div class="ld-super-avatar-fallback">?</div>
      <div>
        <div class="ld-super-name" style="color:var(--muted);">Belum ada Supervisor</div>
        <div class="ld-super-role">Atur di menu Kelola User (role IE)</div>
      </div>
    </div>`;

  const row = (k,v) => `<div class="detail-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const confidentialRows = __lineDetailIsIE ? `
    ${row('Jumlah Mesin', fmtNum(r.mesin))}
    ${row('MC Shift (Mesin÷8×7)', r.mcShift8h>0?fmtNum(r.mcShift8h,1):'-')}
    ${row('Productivity', r.productivity===null?'-':fmtNum(r.productivity,2))}
    ${row('Contribution', r.contribution===null?'-':fmtNum(r.contribution,0))}
  ` : '';

  document.getElementById('lineDetailContent').innerHTML = `
    <div class="ld-hero ${r.cls}">

// ---------- Balance Qty (BLC) & Forecast Target Harian/Mingguan/Bulanan ----------
// Catatan penting: Target Harian/Mingguan/Bulanan dihitung dari KAPASITAS
// harian line saat ini (Target Harian Penuh, dari SMV/MP/Jam Kerja style yang
// aktif sekarang) -- sengaja TIDAK dikaitkan ke Plan Finish, karena Plan
// Finish melekat ke style yang berjalan dan bisa berganti beberapa kali
// sebulan. Asumsi hari kerja: Senin-Sabtu (Minggu libur), 6 hari kerja/minggu,
// ~26 hari kerja/bulan.
//
// BLC (Balance Qty) DIAKUMULASI dari SEMUA order/style yang pernah tercatat
// jalan di line ini (tabel line_orders), bukan cuma style yang aktif
// sekarang -- setiap order dihitung sisanya sendiri (qty_order dikurangi
// output riil selama rentang tanggal order itu berjalan), lalu dijumlah semua.
// Riwayat order baru mulai tercatat sejak fitur ini dipasang; order yang
// sudah lewat sebelum itu tidak ikut terhitung (datanya sudah tidak ada lagi).
async function loadLineForecast(line, targetFull){
  const grid = document.getElementById('ldForecastGrid');
  const noteEl = document.getElementById('ldForecastNote');
  if(!grid) return;

  const targetHarian = targetFull > 0 ? Math.round(targetFull) : null;
  const targetMingguan = targetHarian!==null ? targetHarian * 6 : null;
  const targetBulanan = targetHarian!==null ? targetHarian * 26 : null;

  try{
    const orders = (await apiGet('/line-orders?line='+encodeURIComponent(line)))
      .filter(o=>o.plan_start)
      .sort((a,b)=> a.plan_start < b.plan_start ? -1 : a.plan_start > b.plan_start ? 1 : 0);

    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr2 = toDateStr(today);
    const startedOrders = orders.filter(o=>o.plan_start <= todayStr2);

    if(!startedOrders.length){
      grid.innerHTML = `
        <div class="ld-stat"><div class="lbl">Balance Qty (BLC)</div><div class="val">-</div></div>
        <div class="ld-stat"><div class="lbl">Target Harian</div><div class="val">${targetHarian===null?'-':fmtNum(targetHarian)}</div></div>
        <div class="ld-stat"><div class="lbl">Target Mingguan</div><div class="val">${targetMingguan===null?'-':fmtNum(targetMingguan)}</div></div>
        <div class="ld-stat"><div class="lbl">Target Bulanan</div><div class="val">${targetBulanan===null?'-':fmtNum(targetBulanan)}</div></div>
      `;
      if(noteEl) noteEl.textContent = 'Belum ada riwayat order tercatat untuk line ini (riwayat mulai terisi otomatis begitu Style & Plan Start disimpan di Variabel per Line).';
      return;
    }

    // Rentang tanggal tiap order: dari plan_start-nya sampai sehari sebelum
    // plan_start order berikutnya (atau sampai hari ini kalau dia order
    // terakhir/masih berjalan).
    const ranges = startedOrders.map((o,i)=>{
      const next = startedOrders[i+1];
      let end;
      if(next){
        const d = new Date(next.plan_start+'T00:00:00');
        d.setDate(d.getDate()-1);
        end = d < today ? d : today;
      } else {
        end = today;
      }
      return { order:o, start: new Date(o.plan_start+'T00:00:00'), end };
    });

    // Kumpulkan semua tanggal unik yang perlu di-fetch (rentang antar order
    // selalu berurutan tanpa tumpang tindih, jadi totalnya cuma sepanjang
    // hari sejak order tercatat pertama sampai hari ini).
    const allDatesSet = new Set();
    ranges.forEach(rg=>{ datesBetween(rg.start, rg.end).forEach(d=>allDatesSet.add(d)); });
    const allDates = Array.from(allDatesSet);

    const perDayResults = await Promise.all(allDates.map(async d=>{
      const logs = await apiGet('/qty-logs?line='+encodeURIComponent(line)+'&date='+d);
      let dayMax = 0;
      (logs||[]).forEach(q=>{ const cum = Number(q.qty)||0; if(cum > dayMax) dayMax = cum; });
      return { date: d, value: dayMax };
    }));
    const outputByDate = {};
    perDayResults.forEach(({date,value})=>{ outputByDate[date] = value; });

    let totalBlc = 0;
    let totalProduced = 0;
    ranges.forEach(rg=>{
      const datesInRange = datesBetween(rg.start, rg.end);
      const producedInRange = datesInRange.reduce((s,d)=>s+(outputByDate[d]||0), 0);
      const qtyOrder = Number(rg.order.qty_order) || 0;
      const balance = Math.max(0, qtyOrder - producedInRange);
      totalBlc += balance;
      totalProduced += producedInRange;
    });

    grid.innerHTML = `
      <div class="ld-stat"><div class="lbl">Balance Qty (BLC)</div><div class="val">${fmtNum(totalBlc)}</div></div>
      <div class="ld-stat"><div class="lbl">Sudah Diproduksi</div><div class="val">${fmtNum(totalProduced)}</div></div>
      <div class="ld-stat"><div class="lbl">Target Harian</div><div class="val">${targetHarian===null?'-':fmtNum(targetHarian)}</div></div>
      <div class="ld-stat"><div class="lbl">Target Mingguan</div><div class="val">${targetMingguan===null?'-':fmtNum(targetMingguan)}</div></div>
      <div class="ld-stat"><div class="lbl">Target Bulanan</div><div class="val">${targetBulanan===null?'-':fmtNum(targetBulanan)}</div></div>
    `;
    if(noteEl){
      noteEl.textContent = 'BLC diakumulasi dari '+startedOrders.length+' order tercatat sejak '+fmtDate(startedOrders[0].plan_start)+'. Target harian/mingguan/bulanan dari kapasitas line saat ini, asumsi 6 hari kerja/minggu (Minggu libur) — tidak terikat Plan Finish.';
    }
  }catch(err){
    grid.innerHTML = '<div class="ld-stat"><div class="lbl">Balance Qty (BLC)</div><div class="val" style="color:var(--red);">Error</div></div>';
    if(noteEl) noteEl.textContent = 'Gagal memuat forecast: '+err.message;
  }
}

function smxGradeOf(total){
  if(total > 1) return 'a';
  if(total >= 0.6) return 'b';
  return 'c';
}

async function renderLineSkillMatrix(line){
  const root = document.getElementById('lineSkillMatrixContent');
  root.innerHTML = `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <h2 style="margin-bottom:2px;">Skill Matrix — Line ${escapeHtml(line)}</h2>
          <p class="sub" style="margin-bottom:0;">Kolom = proses/skill yang pernah tercatat di line ini (semua style), baris = operator. Warna sel menandakan grade operator pada proses tersebut berdasarkan SMV.</p>
        </div>
        <button type="button" class="btn green sm" id="smxExportBtn">Export sebagai Gambar</button>
      </div>
      <div class="sm-legend" style="margin-top:14px;">
        <span><i style="background:var(--green);"></i> Grade A — SMV &gt; 1 menit</span>
        <span><i style="background:var(--amber);"></i> Grade B — SMV 0,6–1 menit</span>
        <span><i style="background:var(--red);"></i> Grade C — SMV &lt; 0,6 menit</span>
        <span>Sel kosong = operator belum tercatat mengerjakan proses itu</span>
      </div>
      <div class="smx-wrap" id="smxWrap"><div class="sm-empty">Memuat...</div></div>
    </div>
  `;

  document.getElementById('smxExportBtn').addEventListener('click', ()=>{
    exportElementAsImage('smxWrap', 'skill-matrix-line-'+line+'.png');
  });

  try{
    const rows = await apiGet('/line-processes?line='+encodeURIComponent(line));
    const wrap = document.getElementById('smxWrap');
    if(!rows.length){ wrap.innerHTML = '<div class="sm-empty">Belum ada breakdown proses tersimpan untuk line ini.</div>'; return; }

    // Kumpulkan proses unik (kolom) & operator unik (baris), lalu rata-ratakan
    // SMV kalau satu operator+proses muncul lebih dari sekali (beda style).
    const processNames = [];
    const processSeen = new Set();
    const operatorNames = [];
    const operatorSeen = new Set();
    const cellMap = {}; // key: operator||proses -> {sum, count}
    const processSmvMap = {}; // proses -> {sum, count} -- dipakai buat urutan kolom

    rows.forEach(p=>{
      const proc = (p.nama_proses||'').trim();
      const op = (p.nama_operator||'').trim();
      if(!proc || !op) return;
      if(!processSeen.has(proc)){ processSeen.add(proc); processNames.push(proc); }
      if(!operatorSeen.has(op)){ operatorSeen.add(op); operatorNames.push(op); }
      const key = op + '||' + proc;
      if(!cellMap[key]) cellMap[key] = { sum:0, count:0 };
      cellMap[key].sum += Number(p.smv) || 0;
      cellMap[key].count += 1;
      if(!processSmvMap[proc]) processSmvMap[proc] = { sum:0, count:0 };
      processSmvMap[proc].sum += Number(p.smv) || 0;
      processSmvMap[proc].count += 1;
    });

    // Kolom diurutkan dari SMV rata-rata proses terendah ke tertinggi (kiri ke kanan).
    processNames.sort((a,b)=>{
      const smvA = processSmvMap[a].sum / processSmvMap[a].count;
      const smvB = processSmvMap[b].sum / processSmvMap[b].count;
      return smvA - smvB;
    });
    operatorNames.sort((a,b)=>a.localeCompare(b));

    if(!processNames.length || !operatorNames.length){
      wrap.innerHTML = '<div class="sm-empty">Data proses belum lengkap (nama proses/operator kosong).</div>';
      return;
    }

    const theadCols = processNames.map(p=>`<th>${escapeHtml(p)}</th>`).join('');
    const bodyRows = operatorNames.map(op=>{
      const cells = processNames.map(proc=>{
        const key = op + '||' + proc;
        const c = cellMap[key];
        if(!c) return '<td class="smx-cell smx-empty-cell"></td>';
        const avg = c.sum / c.count;
        const g = smxGradeOf(avg);
        return `<td class="smx-cell grade-${g}" title="${escapeHtml(proc)} — ${fmtNum(avg,2)} menit"><span class="smx-dot"></span></td>`;
      }).join('');
      return `<tr><td class="smx-rowhead">${escapeHtml(op)}</td>${cells}</tr>`;
    }).join('');

    wrap.innerHTML = `
      <table class="smx-table">
        <thead><tr><th class="smx-corner">Nama Operator</th>${theadCols}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    `;
  }catch(err){
    document.getElementById('smxWrap').innerHTML = '<div class="sm-empty" style="color:var(--red);">Gagal memuat: '+err.message+'</div>';
  }
}

  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Memproses...';
  const { error } = await sbClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Masuk';
  if(error){ errEl.textContent = 'Login gagal: email atau password salah.'; return; }
  await showApp();
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sbClient.auth.signOut();
  showLogin();
});

function showLogin(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function loadCurrentUser(){
  const headers = await authHeader();
  const res = await fetch(API_BASE + '/me', { headers });
  if(!res.ok) throw new Error('Gagal memuat profil user.');
  return res.json();
}

async function showApp(){
  try{
    currentUser = await loadCurrentUser();
  }catch(err){
    showToast('Gagal memuat profil: ' + err.message);
    await sbClient.auth.signOut();
    showLogin();
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.fullName || currentUser.email;
  document.getElementById('userRoleBadge').textContent = currentUser.role;
  document.getElementById('userRoleBadge').className = 'role-badge ' + currentUser.role;
  const lineBadge = document.getElementById('userLineBadge');
  if(currentUser.line){ lineBadge.textContent = 'LINE ' + currentUser.line; lineBadge.classList.remove('hidden'); }
  else { lineBadge.classList.add('hidden'); }

  ['view-tamu','view-supervisor','view-ie','view-linedetail','view-lineskillmatrix'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  loadSupervisors(); // non-blocking -- kartu Supervisor di halaman detail line akan terisi begitu selesai

  if(currentUser.role === 'tamu'){
    document.getElementById('view-tamu').classList.remove('hidden');
    renderTamuView();
  } else if(currentUser.role === 'supervisor'){
    document.getElementById('view-supervisor').classList.remove('hidden');
    renderSupervisorView();
  } else if(currentUser.role === 'ie'){
    document.getElementById('view-ie').classList.remove('hidden');
    initIeView();
  } else {
    showToast('Role tidak dikenali: ' + currentUser.role);
  }
}

async function initAuth(){
  const { data:{ session } } = await sbClient.auth.getSession();
  if(session){ await showApp(); } else { showLogin(); }
}

// ================================================================
// Dashboard helper (dipakai oleh Tamu & sub-tab Dashboard IE)
// period: 'daily' | 'weekly' | 'monthly'
// ================================================================
async function buildDashboardHtml(period, refDate){
  const dates = periodDatesFor(period, refDate);
  const isIE = currentUser && currentUser.role === 'ie';

  const [allConfigs, allOrders, perDateOutputs, settings] = await Promise.all([
    // Sejak line_config disederhanakan jadi 1 baris aktif per line (tidak ada
    // histori per tanggal lagi), config ini berlaku untuk seluruh tanggal di
    // periode -- cukup ambil sekali tanpa filter tanggal. line_config sekarang
    // CUMA berisi data Setup Line (MP/WH/Mesin/Jenis Line/dst) -- data
    // Style/Qty Order/SMV/Plan Start-Finish/Delivery Date ada di line_orders
    // (baris riwayat, tidak ditimpa), digabung di bawah.
    apiGet('/line-config'),
    apiGet('/line-orders'),
    Promise.all(dates.map(async d=>{
      const [qtyLogs, attendances] = await Promise.all([
        apiGet('/qty-logs?date=' + d),
        apiGet('/attendance?date=' + d),
      ]);
      return { date: d, qtyLogs, attendances };
    })),
    apiGet('/settings'),
  ]);
  const grossMargin = Number(settings.gross_margin) || 0;

  // 1 baris config (Setup Line) per line -- berlaku sama untuk semua tanggal di periode.
  const configsByLine = {};
  allConfigs.forEach(c=>{
    if(!configsByLine[c.line] || c.date > configsByLine[c.line].date) configsByLine[c.line] = c;
  });

  // Order/Style TERKINI per line = plan_start terbaru (kalau sama, updated_at
  // terbaru yang menang). line_orders sendiri tetap simpan seluruh riwayat --
  // di sini cuma diambil satu yang lagi berjalan buat KPI/andon/dashboard.
  const currentOrderByLine = {};
  allOrders.forEach(o=>{
    const cur = currentOrderByLine[o.line];
    if(!cur || o.plan_start > cur.plan_start || (o.plan_start === cur.plan_start && (o.updated_at||'') > (cur.updated_at||''))){
      currentOrderByLine[o.line] = o;
    }
  });

  function effectiveConfigAsOf(line, d){
    const setup = configsByLine[line] || null;
    const order = currentOrderByLine[line] || null;
    if(!setup && !order) return null;
    return {
      ...(setup||{}),
      style: order ? order.style : '',
      qty_order: order ? Number(order.qty_order)||0 : 0,
      smv: order ? Number(order.smv)||0 : 0,
      plan_start: order ? order.plan_start : null,
      plan_finish: order ? order.plan_finish : null,
      delivery_date: order ? order.delivery_date : null,
      target_output: order ? Number(order.target_output)||0 : 0,
    };
  }

  const perLine = {};
  const allLines = new Set(LINES);
  Object.keys(configsByLine).forEach(l=>allLines.add(l));
  allLines.forEach(l => perLine[l] = { line:l, target:0, targetFull:0, output:0, present:0, absent:0, mesin:0, hasConfig:false, style:'', lineType:'assembly' });

  const nowMs = Date.now();
  // Target berjalan (prorata jam) -- dipakai untuk Efisiensi, bukan target harian penuh.
  // Contoh: shift mulai 08:00, WH 7 jam, target harian 550. Jam 11:00 (3 jam berjalan)
  // target-s.d.-sekarang = 550 * (3/7) ~ 235, bukan 550. Kalau baris tidak punya
  // Jam Mulai Shift, fallback ke target harian penuh (perilaku lama, tidak berubah).
  function targetToDate(c, date, fullTarget){
    if(!c.shift_start || !(c.wh>0)) return fullTarget;
    const parts = String(c.shift_start).split(':');
    const sh = Number(parts[0]), sm = Number(parts[1]||0);
    if(isNaN(sh)) return fullTarget;
    const shiftStartHour = sh + sm/60;
    const crossesMidnight = (shiftStartHour + Number(c.wh)) > 24;
    // 'date' di sini adalah tanggal BISNIS (tanggal shift berakhir/tempat output
    // dicatat -- lihat computeBusinessDate). Untuk shift yang menyeberang tengah
    // malam, jam mulai sesungguhnya ada di kalender H-1, BUKAN di 'date' itu sendiri.
    // Kalau ini tidak dikoreksi, begitu jam sekarang lewat dari jam mulai shift lagi
    // (siklus shift berikutnya), sisa target dihitung ulang dari 0 padahal shift
    // hari itu sudah selesai dan outputnya sudah penuh -- efisiensi jadi meledak >100%.
    let startDateStr = date;
    if(crossesMidnight){
      const d = new Date(date+'T00:00:00');
      d.setDate(d.getDate()-1);
      startDateStr = toDateStr(d);
    }
    const shiftStart = new Date(startDateStr+'T'+c.shift_start+':00');
    if(isNaN(shiftStart.getTime())) return fullTarget;
    let elapsedH = (nowMs - shiftStart.getTime()) / 3600000;
    elapsedH = Math.max(0, Math.min(elapsedH, c.wh));
    return fullTarget * (elapsedH / c.wh);
  }

  perDateOutputs.forEach(({date, qtyLogs, attendances})=>{
    allLines.forEach(l=>{
      const c = effectiveConfigAsOf(l, date);
      if(c){
        const fullTarget = c.target_output > 0 ? c.target_output : (c.smv>0 ? (c.mp*c.wh*60/c.smv) : 0);
        perLine[l].target += targetToDate(c, date, fullTarget);
        perLine[l].targetFull += fullTarget;
        perLine[l].mesin = Number(c.mesin) || perLine[l].mesin;
        perLine[l].style = c.style || perLine[l].style;
        perLine[l].lineType = c.line_type === 'preparation' ? 'preparation' : 'assembly';
        perLine[l].hasConfig = true;
        perLine[l].smv = c.smv;
        perLine[l].mp = c.mp;
        perLine[l].wh = c.wh;
        perLine[l].shiftStart = c.shift_start || null;
        perLine[l].planStart = c.plan_start || null;
        perLine[l].planFinish = c.plan_finish || null;
        perLine[l].deliveryDate = c.delivery_date || null;
        perLine[l].qtyOrder = Number(c.qty_order) || 0;
        perLine[l].notes = c.notes || '';
      }
    });
    const dayOutput = {};
    qtyLogs.forEach(q=>{
      if(!perLine[q.line]) { allLines.add(q.line); perLine[q.line] = { line:q.line, target:0, targetFull:0, output:0, present:0, absent:0, mesin:0, hasConfig:false, style:'', lineType:'assembly' }; }
      // qty bersifat kumulatif per slot per hari, jadi output harian = nilai kumulatif TERTINGGI hari itu.
      const cum = Number(q.qty)||0;
      if(!dayOutput[q.line] || cum > dayOutput[q.line]) dayOutput[q.line] = cum;
    });
    Object.keys(dayOutput).forEach(l=>{ perLine[l].output += dayOutput[l]; });
    attendances.forEach(a=>{
      if(!perLine[a.line]) { allLines.add(a.line); perLine[a.line] = { line:a.line, target:0, targetFull:0, output:0, present:0, absent:0, mesin:0, hasConfig:false, style:'', lineType:'assembly' }; }
      perLine[a.line].present += Number(a.present_count)||0;
      perLine[a.line].absent += Number(a.absent_count)||0;
    });
  });

  const rows = LINES.map(l=>perLine[l]).concat(
    Array.from(allLines).filter(l=>!LINES.includes(l)).map(l=>perLine[l])
  );

  // ---- Konversi MC Shift ke basis shift 8 jam ----
  // MC Shift = Jumlah Mesin Digunakan / 8 * 7
  // Productivity = Output Aktual ÷ MC Shift
  // Contribution = Productivity x Gross Margin (nilai global, diatur IE)
  rows.forEach(r=>{
    r.outputActual = r.output;                    // output aktual, sesuai update supervisor (tidak dikonversi)
    r.mcShift8h = (r.mesin / 8) * 7;               // MC Shift dihitung dari jumlah mesin, basis 8 jam
    r.productivity = r.mcShift8h>0 ? (r.outputActual / r.mcShift8h) : null;
    r.contribution = r.productivity!==null ? r.productivity * grossMargin : null;
  });
  // Efisiensi = Output Aktual ÷ Target (target berjalan/prorata jam untuk hari ini, target
  // penuh untuk hari yang sudah lewat -- lihat targetToDate()). Target efisiensi perusahaan = 75%.
  rows.forEach(r=>{ r.eff = r.target>0 ? Math.round((r.outputActual/r.target)*100) : null; });
  // PENTING: cls 'empty' (badge "Belum Update") HANYA untuk line yang benar-benar
  // belum ada aktivitas sama sekali (tidak ada config, tidak ada output). Kalau
  // supervisor SUDAH input output tapi Efisiensi tidak bisa dihitung (target=0,
  // biasanya karena SMV/Target belum diisi IE di menu Variabel per Line), itu
  // bukan "Belum Update" -- itu "Target Belum Diisi". Membedakan ini supaya
  // supervisor yang sudah update tidak salah dituduh belum update.
  rows.forEach(r=>{
    const hasActivity = r.hasConfig || r.outputActual>0;
    if(!hasActivity) r.cls = 'empty';
    else if(r.eff===null) r.cls = 'notarget';
    else r.cls = statusClass(r.eff);
  });

  const activeRows = rows.filter(r=>r.hasConfig || r.outputActual>0);
  const normalRows = rows.filter(r=>r.lineType!=='preparation');
  const totalOutputActual = normalRows.reduce((s,r)=>s+r.outputActual,0);
  const totalTarget = normalRows.reduce((s,r)=>s+r.target,0);
  const totalTargetFull = normalRows.reduce((s,r)=>s+r.targetFull,0);
  const blcProduksi = totalOutputActual - totalTargetFull; // minus = kurang dari target, plus = lebih dari target
  // Kehadiran TIDAK dipisah normal/support -- dijumlahkan dari semua line.
  const totalPresent = rows.reduce((s,r)=>s+r.present,0);
  const totalAbsent = rows.reduce((s,r)=>s+r.absent,0);
  const totalMesin = normalRows.reduce((s,r)=>s+r.mesin,0);
  const totalMcShift8h = normalRows.reduce((s,r)=>s+r.mcShift8h,0);
  const avgEff = totalTarget>0 ? Math.round((totalOutputActual/totalTarget)*100) : null;
  const overallProductivity = totalMcShift8h>0 ? (totalOutputActual/totalMcShift8h) : null;
  const overallContribution = overallProductivity!==null ? overallProductivity * grossMargin : null;
  const absenPct = (totalPresent+totalAbsent)>0 ? (totalAbsent/(totalPresent+totalAbsent))*100 : null;

  const counts = { ok:0, watch:0, risk:0, empty:0, notarget:0 };
  normalRows.forEach(r=>counts[r.cls]++);
  const supportCount = rows.filter(r=>r.lineType==='preparation' && (r.hasConfig||r.outputActual>0)).length;

  const pNoun = periodLabelText(period);
  const rangeText = periodRangeText(dates, period);

  const cells = rows.map(r=>{
    const barPct = r.eff===null ? 4 : Math.max(4, Math.min(r.eff, 100));
    const pillLabel = r.cls==='ok' ? 'Baik' : r.cls==='watch' ? 'Waspada' : r.cls==='risk' ? 'Kritis' : r.cls==='notarget' ? 'Target Belum Diisi' : 'Belum Update';
    const isSupport = r.lineType==='preparation';
    const mcShiftMetric = isIE ? `<div class="metric">MC Shift<b>${r.mcShift8h>0?fmtNum(r.mcShift8h,1):'-'}</b></div>` : '';
    return `
      <div class="andon cell ${r.cls}" onclick="openLineDetail('${r.line}')" style="cursor:pointer;${isSupport?'border-style:dashed;':''}">
        <div class="row-top">
          <div>
            <div class="ln">Line ${r.line} ${isSupport?'<span class="pill" style="background:var(--watch-bg);color:var(--amber-ink);margin-left:4px;">Preparation</span>':''}</div>
            <div class="sub" style="margin:2px 0 0;min-height:14px;">${r.style || 'Belum ada style running'}</div>
          </div>
          <span class="pill">${pillLabel}</span>
        </div>
        <div class="sub" style="margin:0 0 3px;display:flex;justify-content:space-between;"><span>Efisiensi</span><b style="font-family:var(--mono);color:var(--ink);">${r.eff===null?'-':r.eff+'%'}</b></div>
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;"></div></div>
        <div class="grid2">
          <div class="metric">Output Aktual<b>${fmtNum(r.outputActual)}</b></div>
          ${mcShiftMetric}
          <div class="metric">Productivity<b>${r.productivity===null?'-':fmtNum(r.productivity,2)}</b></div>
        </div>
        <div class="sub" style="margin:10px 0 0;">Hadir/Absen: <b style="color:var(--ink);font-family:var(--mono);">${fmtNum(r.present)}/${fmtNum(r.absent)}</b></div>
      </div>`;
  }).join('');

  const mcRows = activeRows.length ? activeRows : rows.filter(r=>r.hasConfig);
  const mcTableRows = mcRows.map(r=>{
    const isSupport = r.lineType==='preparation';
    const confidentialCols = isIE ? `
      <td class="num">${fmtNum(r.mesin)}</td>
      <td class="num">${r.mcShift8h>0?fmtNum(r.mcShift8h,1):'-'}</td>` : '';
    return `
    <tr${isSupport?' style="opacity:.75;"':''}>
      <td>LINE ${r.line}</td>
      <td><span class="pill" style="background:${isSupport?'var(--watch-bg)':'var(--green-bg)'};color:${isSupport?'var(--amber-ink)':'var(--green)'};">${isSupport?'Preparation':'Assembly'}</span></td>
      <td class="num">${fmtNum(r.outputActual)}</td>
      ${confidentialCols}
      <td class="num">${r.productivity===null?'-':fmtNum(r.productivity,2)}</td>
      <td class="num">${r.contribution===null?'-':fmtNum(r.contribution,0)}</td>
    </tr>`;
  }).join('');

  const uid = period; // suffix unik untuk canvas id

  const confidentialKpis = isIE ? `
      ${kpiCard({icon:'cog',tint:'var(--panel3)',color:'var(--accent)',label:'Total Mesin Digunakan',value:fmtNum(totalMesin),unit:'mesin',sub:'Jumlah mesin aktual · Line Assembly'})}
      ${kpiCard({icon:'gauge',tint:'var(--panel3)',color:'var(--accent)',label:'MC Shift',value:fmtNum(totalMcShift8h,1),unit:'mesin-shift',sub:'Jumlah Mesin ÷ 8 × 7 · Line Assembly'})}` : '';

  // ---- Top 3 Line (papan peringkat efisiensi, Line Assembly, harus ada target) ----
  const top3 = normalRows
    .filter(r=>r.eff!==null)
    .sort((a,b)=> b.eff-a.eff || b.outputActual-a.outputActual)
    .slice(0,3);
  const MEDALS = ['&#129351;','&#129352;','&#129353;']; // gold, silver, bronze
  const RANK_LABEL = ['Peringkat 1','Peringkat 2','Peringkat 3'];
  // urutan tampil ala podium: 2 - 1 - 3
  const podiumOrder = top3.length===3 ? [1,0,2] : top3.map((_,i)=>i);
  const top3Html = !top3.length ? `<p class="sub" style="text-align:center;padding:10px 0 22px;">Belum ada data efisiensi yang cukup untuk menentukan Top 3 Line.</p>` : `
    <div class="top3-row">
      ${podiumOrder.map(i=>{
        const r = top3[i];
        if(!r) return '';
        return `
        <div class="top3-card rank-${i+1}">
          <div class="top3-medal">${MEDALS[i]}</div>
          <div class="top3-rank-label">${RANK_LABEL[i]}</div>
          <div class="top3-line">Line ${escapeHtml(r.line)}</div>
          <div class="top3-style">${escapeHtml(r.style || 'Belum ada style running')}</div>
          <div class="top3-eff">${r.eff}%</div>
          <div class="top3-eff-label">Efisiensi</div>
          <div class="top3-output">Output Aktual: <b>${fmtNum(r.outputActual)}</b></div>
        </div>`;
      }).join('')}
    </div>`;

  const html = `
    ${periodToggleHtml(period, 'dash', refDate)}
    <p class="sub" style="margin-top:-8px;">${rangeText}</p>

    <div class="kpis">
      ${kpiCard({icon:'box',tint:'var(--accent-soft)',color:'var(--accent)',label:'Output Aktual',value:fmtNum(totalOutputActual),unit:'unit',sub:'Line Assembly · '+pNoun})}
      ${kpiCard({icon:'target',tint:'var(--panel3)',color:'var(--accent)',label:'Target Harian Penuh',value:fmtNum(totalTargetFull),unit:'unit',sub:'Target 1 hari penuh · Line Assembly'})}
      ${kpiCard({icon:'trend',tint: blcProduksi>=0?'var(--green-bg)':'var(--red-bg)', color: blcProduksi>=0?'var(--green)':'var(--red)', label:'BLC Produksi', value:(blcProduksi>0?'+':'')+fmtNum(blcProduksi), unit:'unit', sub:'Output − Target · '+pNoun+' · Line Assembly'})}
      ${kpiCard({icon:'shield',tint: avgEff===null? 'var(--panel3)' : avgEff>=75?'var(--green-bg)':avgEff>=55?'var(--watch-bg)':'var(--red-bg)', color: avgEff===null?'var(--muted)':avgEff>=75?'var(--green)':avgEff>=55?'var(--amber-ink)':'var(--red)', label:'Rata-rata Efisiensi', value:avgEff===null?'-':avgEff+'%', sub:'Target ≥ 75% · Line Assembly'})}
      ${kpiCard({icon:'users',tint: absenPct!==null && absenPct>5 ? 'var(--red-bg)':'var(--green-bg)', color: absenPct!==null && absenPct>5 ? 'var(--red)':'var(--green)', label:'Hadir / Tidak Hadir', value:fmtNum(totalPresent), unit:'/ '+fmtNum(totalAbsent), sub: absenPct===null?'Belum ada data':'Absensi '+fmtNum(absenPct,1)+'% · Semua Line'})}
      ${confidentialKpis}
      ${kpiCard({icon:'trend',tint:'var(--accent-soft)',color:'var(--accent)',label:'Rata-rata Productivity',value:overallProductivity===null?'-':fmtNum(overallProductivity,2),unit:'pcs/mc-shift',sub:'Line Assembly'})}
      ${kpiCard({icon:'trend',tint:'var(--accent-soft)',color:'var(--accent)',label:'Contribution',value:overallContribution===null?'-':fmtNum(overallContribution,0),unit:'/mc-shift',sub:'Productivity × Gross Margin · Line Assembly'})}
    </div>

    <h3 style="margin-top:22px;">&#127942; Top 3 Line — Efisiensi Tertinggi</h3>
    <p class="sub" style="margin:0 0 4px;">${pNoun} · Line Assembly · diurutkan dari Efisiensi tertinggi</p>
    ${top3Html}

    <div class="chart-grid">
      <div class="chart-box">
        <h3 style="margin:0 0 2px;">Efisiensi per Line</h3>
        <p class="sub" style="margin:0 0 10px;">Target garis putus-putus di 75% · semua line ditampilkan (Assembly &amp; Preparation)</p>
        <canvas id="effChart_${uid}" height="115"></canvas>
      </div>
      <div class="chart-box">
        <h3 style="margin:0 0 2px;">Ringkasan Status</h3>
        <div class="donut-wrap">
          <div style="position:relative;width:150px;height:150px;">
            <canvas id="statusDonut_${uid}" width="150" height="150"></canvas>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
              <div class="donut-center">${avgEff===null?'-':avgEff+'%'}</div>
              <div class="sub" style="margin:0;font-size:10px;">Efisiensi</div>
            </div>
          </div>
          <div class="legend-row" style="margin-top:10px;">
            <span><i style="background:var(--green);"></i>Baik ${counts.ok}</span>
            <span><i style="background:var(--amber);"></i>Waspada ${counts.watch}</span>
            <span><i style="background:var(--red);"></i>Kritis ${counts.risk}</span>
            <span><i style="background:var(--faint);"></i>Belum ${counts.empty}</span>
            <span><i style="background:var(--amber);"></i>Target Kosong ${counts.notarget}</span>
          </div>
        </div>
      </div>
    </div>

    <h3 style="margin-top:22px;">Status per Line</h3>
    <div class="legend-row">
      <span><i style="background:var(--green);"></i>Baik (≥75%)</span>
      <span><i style="background:var(--amber);"></i>Waspada (55–74%)</span>
      <span><i style="background:var(--red);"></i>Kritis (&lt;55%)</span>
      <span><i style="background:var(--faint);border:1px dashed var(--amber-ink);"></i>Kartu putus-putus = line Preparation (di luar KPI)</span>
    </div>
    <div class="andon">${cells}</div>

    <h3 style="margin-top:22px;">Summary Productivity &amp; Contribution per Line</h3>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Line</th><th>Jenis</th><th>Output Aktual</th>${isIE?'<th>Mesin</th><th>MC Shift</th>':''}<th>Productivity</th><th>Contribution</th></tr></thead>
        <tbody>${mcTableRows || `<tr><td colspan="${isIE?7:5}" style="text-align:center;color:var(--muted);">Belum ada data.</td></tr>`}</tbody>
      </table>
    </div>
    ${isIE ? `<div class="chart-box"><canvas id="mcChart_${uid}" height="90"></canvas></div>` : ''}

    <h3 style="margin-top:20px;">Grafik Productivity per Line</h3>
    <div class="chart-box"><canvas id="prodChart_${uid}" height="90"></canvas></div>
  `;
  __lineDetailRows = {};
  rows.forEach(r=>{ __lineDetailRows[r.line] = r; });
  __lineDetailIsIE = isIE;
  __lineDetailRangeText = rangeText;

  return { html, rows: mcRows, counts, uid, isIE };
}

function renderEffChart(canvasId, rows){
  const ctx = document.getElementById(canvasId);
  if(!ctx || !window.Chart) return;

async function renderSupervisorView(){
  const root = document.getElementById('view-supervisor');
  const line = currentUser.line;

  if(!line){
    root.innerHTML = `<div class="panel"><h2>Belum ada Line</h2><p class="sub">Akun Anda belum diikat ke line tertentu. Hubungi IE untuk mengatur ini di tab Kelola User.</p></div>`;
    return;
  }

  root.innerHTML = `<div class="panel">Memuat...</div>`;
  const cfg = await getEffectiveLineConfig(line, todayStr());
  const date = computeBusinessDate(cfg && cfg.shift_start, cfg && cfg.wh);
  const isOvernightNote = (cfg && cfg.shift_start && date !== todayStr())
    ? `<p class="sub" style="margin:-10px 0 14px;color:var(--accent-ink);">Shift line ini mulai ${cfg.shift_start} dan menyeberang tengah malam — semua input malam ini otomatis tercatat untuk tanggal <b>${fmtDate(date)}</b> (tanggal shift berakhir), bukan tanggal kalender hari ini.</p>`
    : '';

  root.innerHTML = `
    <div class="panel">
      <h2>Line ${line}</h2>
      <p class="sub">${fmtDate(date)}</p>
      ${isOvernightNote}

      <h3>Input Qty Produksi (kumulatif per 1 jam)</h3>
      <p class="sub" style="margin:-6px 0 12px;">Isi <b>total produksi kumulatif</b> sejak awal hari sampai jam slot ini — bukan hasil 1 jam terakhir saja. Contoh: jam 07:00-08:00 = 80, jam 08:00-09:00 = 150 (artinya slot ini menghasilkan 70 pcs).</p>
      <form id="qtyForm">
        <div class="field-row">
          <div class="field">
            <label>Slot Jam</label>
            <select id="qtySlot">${SLOTS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label>Qty Kumulatif (pcs)</label>
            <input type="number" id="qtyValue" min="0" required>
          </div>
        </div>
        <p id="qtyHint" class="sub" style="margin:-6px 0 12px;"></p>
        <button type="submit" class="btn primary">Simpan Qty</button>
      </form>
      <div class="tbl-wrap" style="margin-top:14px;">
        <table>
          <thead><tr><th>Slot Jam</th><th>Qty Kumulatif</th><th>Produksi Slot</th><th>Update Terakhir</th></tr></thead>
          <tbody id="qtyLogBody"><tr><td colspan="4" style="text-align:center;color:var(--muted);">Memuat...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>Absensi</h3>
      <form id="attForm">
        <div class="field-row">
          <div class="field">
            <label>Jumlah Hadir</label>
            <input type="number" id="attPresent" min="0" required>
          </div>
          <div class="field">
            <label>Jumlah Tidak Hadir</label>
            <input type="number" id="attAbsent" min="0" required>
          </div>
        </div>
        <button type="submit" class="btn primary">Simpan Absensi</button>
      </form>
    </div>
  `;

  let qtyCache = [];
  root.querySelectorAll('table').forEach(makeTableSortable);
  function updateQtyHint(){
    const slotIdx = SLOTS.indexOf(document.getElementById('qtySlot').value);
    let prevCum = 0, prevSlot = null;
    for(let i=slotIdx-1;i>=0;i--){
      const found = qtyCache.find(l=>l.slot===SLOTS[i]);
      if(found){ prevCum = Number(found.qty)||0; prevSlot = SLOTS[i]; break; }
    }
    document.getElementById('qtyHint').textContent = prevSlot
      ? `Kumulatif terakhir (${prevSlot}): ${fmtNum(prevCum)} pcs — isi total sampai slot ini, bukan hanya tambahannya.`
      : 'Belum ada input sebelumnya hari ini — isi total produksi sejak awal shift sampai slot ini.';
  }

  async function refreshQtyTable(){
    const body = document.getElementById('qtyLogBody');
    try{
      const logs = await apiGet('/qty-logs?line='+encodeURIComponent(line)+'&date='+date);
      qtyCache = logs;
      updateQtyHint();
      if(!logs.length){
        body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">Belum ada input hari ini.</td></tr>';
        return;
      }
      const sorted = logs.slice().sort((a,b)=>SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot));
      let prev = 0;
      body.innerHTML = sorted.map(l=>{
        const cum = Number(l.qty)||0;
        const inc = cum - prev;
        prev = cum;
        return `<tr><td>${l.slot}</td><td class="num">${fmtNum(cum)}</td><td class="num">${fmtNum(inc)}</td><td>${new Date(l.updated_at).toLocaleTimeString('id-ID')}</td></tr>`;
      }).join('');
    }catch(err){
      body.innerHTML = '<tr><td colspan="4" style="color:var(--red);">Gagal memuat: '+err.message+'</td></tr>';
    }
  }

  async function loadAttendance(){
    try{
      const list = await apiGet('/attendance?line='+encodeURIComponent(line)+'&date='+date);
      if(list.length){
        document.getElementById('attPresent').value = list[0].present_count;
        document.getElementById('attAbsent').value = list[0].absent_count;
      }
    }catch(err){ /* diamkan, form tetap kosong */ }
  }

  document.getElementById('qtySlot').addEventListener('change', updateQtyHint);

  document.getElementById('qtyForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const slot = document.getElementById('qtySlot').value;
    const qty = document.getElementById('qtyValue').value;
    try{
      await apiPost('/qty-logs', { line, date, slot, qty });
      showToast('Qty kumulatif slot '+slot+' tersimpan.');
      document.getElementById('qtyValue').value = '';
      refreshQtyTable();
    }catch(err){ showToast('Gagal simpan: '+err.message); }
  });

  document.getElementById('attForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const presentCount = document.getElementById('attPresent').value;
    const absentCount = document.getElementById('attAbsent').value;
    try{
      await apiPost('/attendance', { line, date, presentCount, absentCount });
      showToast('Absensi tersimpan.');
    }catch(err){ showToast('Gagal simpan: '+err.message); }
  });

  refreshQtyTable();
  loadAttendance();
}

function initIeView(){

  });

  // ---- Order / Style (riwayat) ----

          <td class="num">${fmtNum(o.qty_order)}</td>

      body.innerHTML = '<tr><td colspan="8" style="color:var(--red);">Gagal memuat: '+err.message+'</td></tr>';
    }
  }

  window.fillLoForm = function(id){
    const o = loCache.find(x=>x.id===id);
    if(!o) return;
    document.getElementById('loLine').value = o.line;
    document.getElementById('loHistoryLine').value = o.line;
    document.getElementById('loStyle').value = o.style||'';
    document.getElementById('loSmv').value = o.smv||'';
    document.getElementById('loQtyOrder').value = o.qty_order||'';
    document.getElementById('loPlanStart').value = o.plan_start||'';
    document.getElementById('loPlanFinish').value = o.plan_finish||'';

    ev.preventDefault();
    const errEl = document.getElementById('settingsError');
    errEl.textContent = '';

      await apiPost('/settings', { key: 'gross_margin', value });
      showToast('Gross Margin tersimpan.');
    }catch(err){ errEl.textContent = 'Gagal: '+err.message; }

    try{
      const settings = await apiGet('/settings');
