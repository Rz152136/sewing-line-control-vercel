  })();

  refreshTable();

  // ---- Detail Proses per Line (paste dari Excel) ----
  let lpParsedRows = [];

  function parseExcelPaste(text){
    return text.split(/\r\n|\n|\r/)
      .map(line => line.trim())
      .filter(line => line.length > 0)
      .map(line => line.split('\t').map(c => c.trim()))
      .filter(cols => cols.length > 1 || cols[0])
      .map(cols => ({
        noProses: cols[0] || '',
        namaProses: cols[1] || '',
        smv: cols[2] || '',
        namaOperator: cols[3] || '',
        namaMesin: cols[4] || '',
      }));
  }

  function renderLpPreview(rows){
    const wrap = document.getElementById('lpPreviewWrap');
    const body = document.getElementById('lpPreviewBody');
    const saveBtn = document.getElementById('lpSaveBtn');
    if(!rows.length){ wrap.style.display = 'none'; saveBtn.disabled = true; return; }
    wrap.style.display = '';
    saveBtn.disabled = false;
    body.innerHTML = rows.map((r,i)=>`
      <tr>
        <td class="num">${escapeHtml(r.noProses)}</td>
        <td>${escapeHtml(r.namaProses)}</td>
        <td class="num">${escapeHtml(r.smv)}</td>
        <td>${escapeHtml(r.namaOperator)}</td>
        <td>${escapeHtml(r.namaMesin)}</td>
      </tr>`).join('');
  }

  async function loadLpSaved(){
    const body = document.getElementById('lpSavedBody');
    const opBody = document.getElementById('lpOperatorBody');
    const line = document.getElementById('lpLine').value;
    const style = document.getElementById('lpStyle').value.trim();
    if(!style){
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Isi Style dulu untuk lihat breakdown tersimpan.</td></tr>';
      opBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);">-</td></tr>';
      return;
    }
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Memuat...</td></tr>';
    try{
      const list = await apiGet('/line-processes?line='+encodeURIComponent(line)+'&style='+encodeURIComponent(style));
      if(!list.length){
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Belum ada breakdown tersimpan untuk Line+Style ini.</td></tr>';
        opBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);">-</td></tr>';
        return;
      }
      body.innerHTML = list.map(p=>`
        <tr>
          <td class="num">${fmtNum(p.no_proses)}</td>
          <td>${escapeHtml(p.nama_proses||'-')}</td>
          <td class="num">${fmtNum(p.smv,2)}</td>
          <td>${escapeHtml(p.nama_operator||'-')}</td>
          <td>${escapeHtml(p.nama_mesin||'-')}</td>
        </tr>`).join('');
      const summary = summarizeByOperator(list);
      opBody.innerHTML = summary.map(s=>`
        <tr>
          <td>${escapeHtml(s.name)}</td>
          <td class="num">${fmtNum(s.count)}</td>
          <td class="num">${fmtNum(s.total,2)}</td>
        </tr>`).join('');
    }catch(err){
      body.innerHTML = '<tr><td colspan="5" style="color:var(--red);">Gagal memuat: '+err.message+'</td></tr>';
      opBody.innerHTML = '<tr><td colspan="3" style="color:var(--red);">Gagal memuat.</td></tr>';
    }
  }

  document.getElementById('lpParseBtn').addEventListener('click', ()=>{
    const errEl = document.getElementById('lpParseError');
    errEl.textContent = '';
    const text = document.getElementById('lpPaste').value;
    if(!text.trim()){ errEl.textContent = 'Paste data dari Excel dulu.'; renderLpPreview([]); return; }
    lpParsedRows = parseExcelPaste(text);
    if(!lpParsedRows.length){ errEl.textContent = 'Tidak ada baris yang bisa dibaca. Pastikan paste langsung dari Excel (antar kolom dipisah Tab).'; }
    renderLpPreview(lpParsedRows);
  });

  document.getElementById('lpSaveBtn').addEventListener('click', async ()=>{
    const errEl = document.getElementById('lpParseError');
    errEl.textContent = '';
    const line = document.getElementById('lpLine').value;
    const style = document.getElementById('lpStyle').value.trim();
    if(!style){ errEl.textContent = 'Isi Style dulu (harus sama dengan Style yang berjalan di line ini).'; return; }
    if(!lpParsedRows.length){ errEl.textContent = 'Belum ada data hasil parse. Klik "Parse & Preview" dulu.'; return; }
    const saveBtn = document.getElementById('lpSaveBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan...';
    try{
      await apiPost('/line-processes', { line, style, rows: lpParsedRows });
      showToast('Breakdown proses line '+line+' tersimpan ('+lpParsedRows.length+' baris).');
      document.getElementById('lpPaste').value = '';
      lpParsedRows = [];
      renderLpPreview([]);
      loadLpSaved();
    }catch(err){ errEl.textContent = 'Gagal: '+err.message; }
    finally{ saveBtn.disabled = false; saveBtn.textContent = 'Simpan Semua'; }
  });

  document.getElementById('lpClearBtn').addEventListener('click', async ()=>{
    const line = document.getElementById('lpLine').value;
    const style = document.getElementById('lpStyle').value.trim();
    if(!style){ showToast('Isi Style dulu.'); return; }
    if(!confirm('Hapus semua breakdown proses untuk Line '+line+' — Style "'+style+'"?')) return;
    try{
      await apiDelete('/line-processes?line='+encodeURIComponent(line)+'&style='+encodeURIComponent(style));
      showToast('Breakdown dihapus.');
      loadLpSaved();
    }catch(err){ showToast('Gagal: '+err.message); }
  });

  document.getElementById('lpLine').addEventListener('change', loadLpSaved);
  document.getElementById('lpStyle').addEventListener('change', loadLpSaved);
}

// ---------- Skill Matrix (grade operator dari total SMV proses yg dikuasai) ----------
async function renderIeSkillMatrix(){
  const root = document.getElementById('ie-skillmatrix');
  root.innerHTML = `
    <div class="panel">
      <h2>Skill Matrix Operator</h2>
      <p class="sub">Grade dihitung dari total SMV seluruh proses yang dipegang tiap operator (dijumlah dari data Detail Proses per Line). Grade A: SMV &gt; 1 menit &middot; Grade B: 0,6–1 menit &middot; Grade C: di bawah 0,6 menit.</p>
      <div class="sm-toolbar">
        <div class="field"><label>Filter Line</label>
          <select id="smLine"><option value="">Semua Line</option>${LINES.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Cari Nama Operator</label><input type="text" id="smSearch" placeholder="cth: Siti"></div>
        <button type="button" class="btn ghost sm" id="smRefreshBtn" style="align-self:flex-end;">Muat Ulang</button>
      </div>
      <div class="sm-legend">
        <span><i style="background:var(--green);"></i> Grade A — SMV &gt; 1 menit</span>
        <span><i style="background:var(--amber);"></i> Grade B — SMV 0,6–1 menit</span>
        <span><i style="background:var(--red);"></i> Grade C — SMV &lt; 0,6 menit</span>
      </div>
      <div class="sm-stats" id="smStats"></div>
      <div class="sm-grid" id="smGrid"><div class="sm-empty">Memuat...</div></div>
    </div>
  `;

  let smAllRows = [];

  function gradeOf(total){
    if(total > 1) return 'a';
    if(total >= 0.6) return 'b';
    return 'c';
  }
  function gradeLabel(g){ return g==='a' ? 'Grade A' : g==='b' ? 'Grade B' : 'Grade C'; }

  function computeOperators(rows){
    const map = {};
    rows.forEach(p=>{
      const name = (p.nama_operator||'').trim();
      if(!name) return; // baris tanpa nama operator dilewati
      const smv = Number(p.smv)||0;
      if(!map[name]) map[name] = { name, total:0, count:0, lines:new Set(), mesin:new Set() };
      map[name].total += smv;
      map[name].count += 1;
      if(p.line) map[name].lines.add(p.line);
      if(p.nama_mesin) map[name].mesin.add(p.nama_mesin);
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  }

  function renderStats(operators){
    const counts = { a:0, b:0, c:0 };
    operators.forEach(o=>counts[gradeOf(o.total)]++);
    document.getElementById('smStats').innerHTML = `
      <div class="sm-stat"><div class="n">${operators.length}</div><div class="l">Total Operator</div></div>
      <div class="sm-stat grade-a"><div class="n">${counts.a}</div><div class="l">Grade A</div></div>
      <div class="sm-stat grade-b"><div class="n">${counts.b}</div><div class="l">Grade B</div></div>
      <div class="sm-stat grade-c"><div class="n">${counts.c}</div><div class="l">Grade C</div></div>
    `;
  }

  function renderGrid(operators){
    const grid = document.getElementById('smGrid');
    if(!operators.length){ grid.innerHTML = '<div class="sm-empty">Belum ada data operator untuk filter ini.</div>'; return; }
    const maxTotal = Math.max(1.4, ...operators.map(o=>o.total));
    grid.innerHTML = operators.map(o=>{
      const g = gradeOf(o.total);
      const pct = Math.min(100, (o.total / maxTotal) * 100);
      const lineChips = Array.from(o.lines).sort().map(l=>`<span class="sm-chip">Line ${escapeHtml(l)}</span>`).join('');
      return `
        <div class="sm-card grade-${g}">
          <div class="top">
            <div class="name">${escapeHtml(o.name)}</div>
            <div class="sm-badge grade-${g}">${gradeLabel(g)}</div>
          </div>
          <div class="smv-row"><span class="smv-val">${fmtNum(o.total,2)}</span><span class="smv-unit">menit SMV</span></div>
          <div class="sm-bar-track"><div class="sm-bar-fill grade-${g}" style="width:${pct}%;"></div></div>
          <div class="meta">
            <span>${o.count} proses dikuasai</span>
            ${o.mesin.size ? `<span>${o.mesin.size} jenis mesin</span>` : ''}
          </div>
          ${lineChips ? `<div class="chips">${lineChips}</div>` : ''}
        </div>`;
    }).join('');
  }

  function applyFilters(){
    const search = document.getElementById('smSearch').value.trim().toLowerCase();
    let operators = computeOperators(smAllRows);
    if(search) operators = operators.filter(o=>o.name.toLowerCase().includes(search));
    renderStats(operators);
    renderGrid(operators);
  }

  async function loadData(){
    const grid = document.getElementById('smGrid');
    grid.innerHTML = '<div class="sm-empty">Memuat...</div>';
    document.getElementById('smStats').innerHTML = '';
    const line = document.getElementById('smLine').value;
    try{
      const qs = line ? ('?line='+encodeURIComponent(line)) : '';
      smAllRows = await apiGet('/line-processes'+qs);
      applyFilters();
    }catch(err){
      grid.innerHTML = '<div class="sm-empty" style="color:var(--red);">Gagal memuat: '+err.message+'</div>';
    }
  }

  document.getElementById('smLine').addEventListener('change', loadData);
  document.getElementById('smSearch').addEventListener('input', applyFilters);
  document.getElementById('smRefreshBtn').addEventListener('click', loadData);

  loadData();
}

// ---------- Data Produksi (oversight semua line, + export) ----------
async function renderIeData(){
  const root = document.getElementById('ie-data');
  root.innerHTML = `
    <div class="panel">
      <h2>Data Produksi</h2>
      <div class="field-row">
        <div class="field"><label>Tanggal</label><input type="date" id="dataDate" value="${todayStr()}"></div>
        <div class="field"><label>Line (opsional)</label>
          <select id="dataLine"><option value="">Semua Line</option>${LINES.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
        </div>
      </div>
      <button class="btn ghost sm" id="dataFilterBtn">Terapkan Filter</button>
      <button class="btn ghost sm" id="dataExportBtn">Export Excel</button>

      <h3 style="margin-top:20px;">Qty per Slot (kumulatif)</h3>
      <div class="tbl-wrap">
        <table><thead><tr><th>Line</th><th>Tanggal</th><th>Slot</th><th>Qty Kumulatif</th><th>Produksi Slot</th></tr></thead>
        <tbody id="dataQtyBody"></tbody></table>
      </div>

      <h3 style="margin-top:20px;">Absensi</h3>
      <div class="tbl-wrap">
        <table><thead><tr><th>Line</th><th>Tanggal</th><th>Hadir</th><th>Tidak Hadir</th></tr></thead>
        <tbody id="dataAttBody"></tbody></table>
      </div>
    </div>
  `;

  let lastQty = [], lastAtt = [];
  root.querySelectorAll('table').forEach(makeTableSortable);

  async function load(){
    const date = document.getElementById('dataDate').value;
    const line = document.getElementById('dataLine').value;
    let qPath = '/qty-logs?date=' + date;
    let aPath = '/attendance?date=' + date;
    if(line){ qPath += '&line='+encodeURIComponent(line); aPath += '&line='+encodeURIComponent(line); }

    document.getElementById('dataQtyBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Memuat...</td></tr>';
    document.getElementById('dataAttBody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">Memuat...</td></tr>';

    try{
      const [qty, att] = await Promise.all([apiGet(qPath), apiGet(aPath)]);
      lastQty = qty; lastAtt = att;
      if(qty.length){
        const byLine = {};
        qty.forEach(q=>{ (byLine[q.line]=byLine[q.line]||[]).push(q); });
        const rowsHtml = [];
        Object.keys(byLine).sort().forEach(ln=>{
          const sorted = byLine[ln].slice().sort((a,b)=>SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot));
          let prev = 0;
          sorted.forEach(q=>{
            const cum = Number(q.qty)||0;
            const inc = cum - prev;
            prev = cum;
            rowsHtml.push(`<tr><td>${q.line}</td><td>${fmtDate(q.date)}</td><td>${q.slot}</td><td class="num">${fmtNum(cum)}</td><td class="num">${fmtNum(inc)}</td></tr>`);
          });
        });
        document.getElementById('dataQtyBody').innerHTML = rowsHtml.join('');
      } else {
        document.getElementById('dataQtyBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Tidak ada data.</td></tr>';
      }
      document.getElementById('dataAttBody').innerHTML = att.length
        ? att.sort((a,b)=>a.line.localeCompare(b.line))
             .map(a=>`<tr><td>${a.line}</td><td>${fmtDate(a.date)}</td><td class="num">${fmtNum(a.present_count)}</td><td class="num">${fmtNum(a.absent_count)}</td></tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:var(--muted);">Tidak ada data.</td></tr>';
    }catch(err){
      showToast('Gagal memuat data: '+err.message);
    }
  }

  document.getElementById('dataFilterBtn').addEventListener('click', load);
  document.getElementById('dataExportBtn').addEventListener('click', ()=>{
    if(!lastQty.length && !lastAtt.length){ showToast('Tidak ada data untuk diexport.'); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lastQty), 'Qty per Slot');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lastAtt), 'Absensi');
    XLSX.writeFile(wb, 'Data_Produksi_' + document.getElementById('dataDate').value + '.xlsx');
    showToast('File berhasil diexport.');
  });

  load();
}

        </div>
        <div class="field" id="admPhotoField"><label>Foto Supervisor (opsional)</label>
          <input type="file" id="admPhoto" accept="image/png,image/jpeg,image/webp">
        </div>
        <p id="adminCreateError" style="color:var(--red);font-size:12.5px;min-height:1em;"></p>
        <button type="submit" class="btn primary">Buat User</button>
      </form>
    </div>
    <div class="panel" style="max-width:480px;" id="editUserPanel">
      <h3>Edit User</h3>
      <form id="adminEditForm">
        <input type="hidden" id="admEditId">
        <div class="field"><label>Nama Lengkap</label><input type="text" id="admEditFullName" required></div>
        <div class="field"><label>Email</label><input type="email" id="admEditEmail" required></div>
        <div class="field"><label>Password Baru (opsional)</label><input type="text" id="admEditPassword" minlength="6" placeholder="Kosongkan jika tidak diubah"></div>
        <p id="adminEditError" style="color:var(--red);font-size:12.5px;min-height:1em;"></p>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn primary">Simpan Perubahan</button>
          <button type="button" class="btn ghost" id="admEditCancel">Batal</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h3>Daftar User</h3>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Foto</th><th>Nama</th><th>Email</th><th>Role</th><th>Line</th><th>Dibuat</th><th>Aksi</th></tr></thead>
          <tbody id="adminUserBody"></tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById('editUserPanel').classList.add('hidden');

  const roleSel = document.getElementById('admRole');
  root.querySelectorAll('table').forEach(makeTableSortable);
  const lineField = document.getElementById('admLineField');
  const photoField = document.getElementById('admPhotoField');
  function toggleLineField(){
    const show = roleSel.value==='supervisor';
    lineField.style.display = show ? '' : 'none';
    photoField.style.display = show ? '' : 'none';
  }
  roleSel.addEventListener('change', toggleLineField);
  toggleLineField();

  document.getElementById('adminCreateForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const errEl = document.getElementById('adminCreateError');
    errEl.textContent = '';
    const submitBtn = ev.target.querySelector('button[type="submit"]');
    const payload = {
      fullName: document.getElementById('admFullName').value.trim(),
      email: document.getElementById('admEmail').value.trim(),
      password: document.getElementById('admPassword').value,
      role: roleSel.value,
      line: roleSel.value==='supervisor' ? document.getElementById('admLine').value : null,
    };
    const photoFile = document.getElementById('admPhoto').files[0];
    try{
      submitBtn.disabled = true; submitBtn.textContent = 'Memproses...';
      if(photoFile){ payload.photoBase64 = await resizeImageToBase64(photoFile); }
      await apiPost('/admin/users', payload);
      showToast('User '+payload.email+' berhasil dibuat.');
      document.getElementById('adminCreateForm').reset();
      toggleLineField();
      loadSupervisors();
      loadUsers();
    }catch(err){ errEl.textContent = 'Gagal: '+err.message; }
    finally{ submitBtn.disabled = false; submitBtn.textContent = 'Buat User'; }
  });

  const editPanel = document.getElementById('editUserPanel');
  window.openEditUser = function(u){
    document.getElementById('admEditId').value = u.id;
    document.getElementById('admEditFullName').value = u.full_name || '';
    document.getElementById('admEditEmail').value = u.email || '';
    document.getElementById('admEditPassword').value = '';
    document.getElementById('adminEditError').textContent = '';
    editPanel.classList.remove('hidden');
    editPanel.scrollIntoView({ behavior:'smooth', block:'start' });
  };
  document.getElementById('admEditCancel').addEventListener('click', ()=>{
    editPanel.classList.add('hidden');
  });
  document.getElementById('adminEditForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const errEl = document.getElementById('adminEditError');
    errEl.textContent = '';
    const submitBtn = ev.target.querySelector('button[type="submit"]');
    const id = document.getElementById('admEditId').value;
    const newPassword = document.getElementById('admEditPassword').value;
    const payload = {
      id,
      fullName: document.getElementById('admEditFullName').value.trim(),
      email: document.getElementById('admEditEmail').value.trim(),
    };
    if(newPassword){
      if(newPassword.length < 6){ errEl.textContent = 'Password baru minimal 6 karakter.'; return; }
      payload.newPassword = newPassword;
    }
    try{
      submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...';
      await apiPatch('/admin/users', payload);
      showToast('User berhasil diperbarui.');
      editPanel.classList.add('hidden');
      loadSupervisors();
      loadUsers();
    }catch(err){ errEl.textContent = 'Gagal: '+err.message; }
    finally{ submitBtn.disabled = false; submitBtn.textContent = 'Simpan Perubahan'; }
  });

  async function loadUsers(){
    const body = document.getElementById('adminUserBody');
    body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);">Memuat...</td></tr>';
    try{
      const users = await apiGet('/admin/users');
      if(!users.length){ body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);">Belum ada user.</td></tr>'; return; }
      const usersById = {};
      users.forEach(u=>{ usersById[u.id] = u; });
      window.__adminUsersById = usersById;
      body.innerHTML = users.map(u=>{
        const created = u.created_at ? new Date(u.created_at).toLocaleDateString('id-ID') : '-';
        const isMe = u.id === currentUser.id;
        const photoCell = u.photo_url
          ? `<img src="${escapeHtml(u.photo_url)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">`
          : `<div style="width:34px;height:34px;border-radius:50%;background:var(--panel2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:12px;">${initials(u.full_name||u.email)}</div>`;
        return `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:6px;">
              ${photoCell}
              <label class="btn ghost sm" style="cursor:pointer;margin:0;">
                Ubah
                <input type="file" class="admPhotoInput" data-id="${u.id}" accept="image/png,image/jpeg,image/webp" style="display:none;">
              </label>
            </div>
          </td>
          <td>${u.full_name||'-'}</td>
          <td>${u.email}</td>
          <td>
            <select data-id="${u.id}" class="admRoleSelect" ${isMe?'disabled':''}>
              <option value="supervisor" ${u.role==='supervisor'?'selected':''}>Supervisor</option>
              <option value="ie" ${u.role==='ie'?'selected':''}>IE</option>
              <option value="tamu" ${u.role==='tamu'?'selected':''}>Tamu</option>
            </select>
          </td>
          <td>
            <select data-id="${u.id}" class="admLineSelect" ${u.role!=='supervisor'?'disabled':''}>
              <option value="">-</option>
              ${LINES.map(l=>`<option value="${l}" ${u.line===l?'selected':''}>${l}</option>`).join('')}
            </select>
          </td>
          <td>${created}</td>
          <td style="display:flex;gap:6px;">
            <button class="btn ghost sm" onclick="openEditUser(__adminUsersById['${u.id}'])">Edit</button>
            ${isMe?'':`<button class="btn danger sm" onclick="adminDeleteUser('${u.id}')">Hapus</button>`}
          </td>
        </tr>`;
      }).join('');

      document.querySelectorAll('.admRoleSelect').forEach(sel=>{
        sel.addEventListener('change', async ()=>{
          try{
            await apiPatch('/admin/users', { id: sel.dataset.id, role: sel.value });
            showToast('Role diperbarui.');
            loadUsers();
          }catch(err){ showToast('Gagal: '+err.message); loadUsers(); }
        });
      });
      document.querySelectorAll('.admLineSelect').forEach(sel=>{
        sel.addEventListener('change', async ()=>{
          try{
            await apiPatch('/admin/users', { id: sel.dataset.id, line: sel.value || null });
            showToast('Line diperbarui.');
            loadSupervisors();
          }catch(err){ showToast('Gagal: '+err.message); loadUsers(); }
        });
      });
      document.querySelectorAll('.admPhotoInput').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const file = inp.files[0];
          if(!file) return;
          try{
            const photoBase64 = await resizeImageToBase64(file);
            await apiPatch('/admin/users', { id: inp.dataset.id, photoBase64 });
            showToast('Foto diperbarui.');
            loadSupervisors();
            loadUsers();
          }catch(err){ showToast('Gagal: '+err.message); }
        });
      });
    }catch(err){
      body.innerHTML = '<tr><td colspan="7" style="color:var(--red);">Gagal memuat: '+err.message+'</td></tr>';
    }
  }

  window.adminDeleteUser = async function(id){
    if(!confirm('Hapus user ini secara permanen?')) return;
    try{
      await apiDelete('/admin/users?id='+encodeURIComponent(id));
      showToast('User dihapus.');
      loadUsers();
    }catch(err){ showToast('Gagal: '+err.message); }
  };

  loadUsers();
}

// ---------- Init ----------
if (sbClient) {
  initAuth().catch(e=>{
    const box = document.getElementById('fatalError');
    if(box){ box.style.display='block'; box.textContent = 'Gagal inisialisasi: ' + e.message; }
  });
}
</script>
</body>
</html>
